name: Allure Report

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TRELLO_API_KEY: ${{ secrets.TRELLO_API_KEY }}
      TRELLO_TOKEN: ${{ secrets.TRELLO_TOKEN }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Checkout previous report (for trend history)
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: allure-reports-branch
          path: previous-report

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run tests
        run: npx playwright test
        continue-on-error: true

      - name: Carry forward Allure trend history
        run: |
          if [ -d previous-report/history ]; then
            mkdir -p allure-results
            cp -r previous-report/history allure-results/history
          fi

      - name: Generate Allure report
        run: npx allure generate allure-results --clean -o allure-report

      - name: Publish report to allure-reports-branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: allure-reports-branch
          publish_dir: allure-report
          force_orphan: true
